name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  # No timer (Dinis, 19 Nov 2026 ~01:20 UTC, PrompTugal__News__Website board/guidance/2026-11-19-every-run-starts-from-a-commit.md):
  # every run starts from a commit. data.b@'s hourly wake collects and commits the data; its push builds and deploys.
  # workflow_dispatch is for a person only; no agent calls it.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        env:
          EVENT: ${{ github.event_name }}
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; elif [ "$EVENT" = "schedule" ]; then next=$last; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The check tests (functional; the checks themselves run in the verify job, from the anchor)
        if: github.event_name != 'schedule'
        run: node scripts/test-check-signatures.mjs
      # No collection here: the data in data/ and vaults/<id>/latest/ is what data.b@'s wake read and committed, so the
      # same commit builds the same site (every-run-starts-from-a-commit, 19 Nov 2026). Every host the collectors read was
      # reached from data.b@'s session on 19 Nov 2026.
      - name: Push the bytes read to each source's vault (skipped until the vault secrets exist)
        env:
          SG_SEND_ACCESS_TOKEN: ${{ secrets.SG_SEND_ACCESS_TOKEN }}
          DATA_VAULT_KEYS: ${{ secrets.DATA_VAULT_KEYS }}
        run: |
          if [ -n "$SG_SEND_ACCESS_TOKEN" ] && [ -n "$DATA_VAULT_KEYS" ]; then
            pip install -q sgit-ai==0.27.0
            node collect/vault-push.mjs || echo "::warning::a vault push failed; the site is still deployed"
          else
            echo "No vault secrets: the vaults are not updated by CI (see board/team/data/debriefs/2026-11-17-first-version.md)"
          fi
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - name: The preview for social cards (/preview.png from /preview-card.svg; skipped where the runner has no converter)
        run: |
          command -v rsvg-convert >/dev/null || (sudo apt-get -qq update && sudo apt-get -qq install -y librsvg2-bin) >/dev/null 2>&1 || true
          if command -v rsvg-convert >/dev/null; then rsvg-convert -w 1200 -h 630 _site/preview-card.svg -o _site/preview.png || echo "::warning::preview.png not made"
          else echo "::warning::no SVG converter on the runner: preview.png not made"; fi
      - run: node scripts/validate.mjs
      - name: Leak scan (tracked files and the built site)
        # functional; the leak scan that decides runs in the verify job, from the anchor (controls 7 and 9)
        run: node scripts/test-leak-scan.mjs && node scripts/leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # Control 9 (security@'s fifth ruling, 19 Nov 2026 ~14:20 UTC, from civic's finding): the signature, trailer and leak
  # checks run in their own job, which runs no code from the pushed tree. It checks out, finds the anchor A in GitHub's own
  # record of runs (never git, tags or BEFORE), requires A to be an ancestor of the
  # pushed commit, takes scripts/trusted-checks.sh and the checks from A's tree into RUNNER_TEMP, and runs them over A..AFTER.
  # Since the sixth ruling (~14:26 UTC) A is the head of the latest successful push run of this workflow on dev.
  # The build output reaches it only as data (the uploaded Pages artifact, unpacked with symlinks refused). Deploy needs it.
  # A pushed build step that writes GITHUB_ENV cannot reach this job: each job has its own environment.
  verify:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Signatures, trailers and the leak scan, from the anchor
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          unset NODE_OPTIONS
          NODE="$(command -v node)"; case "$NODE" in /*) ;; *) echo "node is not at an absolute path" >&2; exit 1;; esac
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          # security@'s sixth ruling (~14:26 UTC, civic.b@'s finding: anyone with write access can create a "successful
          # deployment"): the anchor is the head commit of the latest run of this workflow file, on dev, from a push, that
          # succeeded. Only GitHub Actions creates runs. Read from GitHub's API, never from git, tags or BEFORE.
          anchor=$(api "actions/workflows/pages.yml/runs?branch=dev&event=push&status=success&per_page=20" \
            | jq -r '[.workflow_runs[] | select(.path == ".github/workflows/pages.yml" and .head_branch == "dev" and .event == "push" and .conclusion == "success")][0].head_sha // empty')
          echo "Anchor (head of the latest successful push run of this workflow on dev): ${anchor:-none}"
          [ -n "$anchor" ] || { echo "no anchor: no successful run of this workflow on dev found" >&2; exit 1; }
          git merge-base --is-ancestor "$anchor" "$AFTER" || { echo "the anchor is not an ancestor of the pushed commit" >&2; exit 1; }
          mode=$(git ls-tree "$anchor" scripts/trusted-checks.sh | cut -c1-6)
          [ "$mode" = 100644 ] || [ "$mode" = 100755 ] || { echo "the anchor's scripts/trusted-checks.sh is missing or not a plain file" >&2; exit 1; }
          git show "$anchor:scripts/trusted-checks.sh" > "$RUNNER_TEMP/trusted-checks.sh"
          trusted=$(bash "$RUNNER_TEMP/trusted-checks.sh" "$anchor" "$AFTER" "$RUNNER_TEMP/trusted")
          "$NODE" "$RUNNER_TEMP/trusted/check-commits.mjs" "$trusted" "$AFTER"
          "$NODE" "$RUNNER_TEMP/trusted/check-signatures.mjs" "$trusted" "$AFTER"
          # the built site, as data: unpacked from the artifact, no symlink allowed
          rm -rf _site && mkdir _site && tar --no-same-owner --no-same-permissions -xf "$RUNNER_TEMP/pages/artifact.tar" -C _site
          if [ -n "$(find _site -type l | head -1)" ]; then echo "the built site holds a symlink" >&2; exit 1; fi
          "$NODE" "$RUNNER_TEMP/trusted/leak-scan.mjs"
  deploy:
    needs: [build, verify]
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && github.event_name != 'schedule' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
